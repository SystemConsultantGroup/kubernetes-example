name: Container
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  push:
    branches:
      - main
      - testing
permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.20.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build-image:
    needs: test
    if: always() && (needs.test.result == 'success' || (github.event_name == 'pull_request' && github.event.action == 'closed'))
    uses: SystemConsultantGroup/kubernetes/.github/workflows/build-image.yaml@7de58452e6a795d4dfcdb2817427a20ba3a3b8f6
    with:
      application: example
      workload: fe
      image: ghcr.io/systemconsultantgroup/kubernetes-example
    secrets:
      KUBERNETES_APP_ID: ${{ secrets.KUBERNETES_APP_ID }}
      KUBERNETES_APP_PRIVATE_KEY: ${{ secrets.KUBERNETES_APP_PRIVATE_KEY }}
